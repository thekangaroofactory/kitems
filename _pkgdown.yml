template:
  bootstrap: 5
  light-switch: true

articles:
- title: Framework concepts & components
  desc: Articles to understand the main concepts & components of the package.
  navbar: ~
  contents:
  - core-concepts
  - shiny-module
  - admin

- title: Implementation & features
  desc: Detailed articles about advanced concepts & features.
  navbar: Implementation & features
  contents:
  - implementations
  - communication
  - workflows
  - filtering
  - ordering
  - shortcuts

- title: Other
  desc: Miscellaneous topics
  contents:
  - environment
  - limitations

- title: Specifications
  desc: These documents cover specifications and roadmap.
  contents:
  - roadmap

reference:
- title: Basic Use Case (Full delegation)
  desc: These functions are the core features you need to start using the framework.

- subtitle: Shiny Module Server
  desc: The main component of the package.
  contents:
  - kitems

- subtitle: Shiny Module UI Components
  desc: The UI functions to include into your app.
  contents:
  - ends_with("widget")

- subtitle: Admin
  desc: The functions to perform admin tasks.
  contents:
  - admin

- subtitle: Demos
  desc: Function to list and launch the demo apps.
  contents:
  - runExample

- title: Advanced Scenarios (Mixed or Full control)
  desc: These helper functions can be used to create events to pass to the module server reactive arguments.
  contents:
  - filter_event
  - trigger_event

- title: Behind the scene
  desc: These functions are made available (exported) for advanced users who would like to go beyond the usage of the module server.

- subtitle: Data Governance
  desc: The functions related to data model and config management.
  contents:
  - design
  - extend
  - amend
  - shrink

- subtitle: Behaviors
  desc: The functions related to attribute behavior management.
  contents:
  - starts_with("skip")
  - starts_with("include")
